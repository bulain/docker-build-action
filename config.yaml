# 构建配置 —— 单一事实来源。
#
# workflow 全部为手动 workflow_dispatch，改本文件或 scripts/<pkg>.sh 后需到 Actions 页手动触发。
# 版本覆盖规则：先取更具体的键，再回落到 default；例如 valkey 在 el7 上用 versions.el7。
#
# 注意：oss.endpoint 必须是公网 endpoint。GitHub 托管的 runner 在境外，
# 内网 endpoint（*-internal.aliyuncs.com）不可达。

build:
  source_dir: "/data/src"    # 源码下载与解压目录（容器内）
  output_dir: "/data/files"     # 产物目录（容器内），workflow 挂载宿主机 out/ 到这里

oss:
  # bucket 与 endpoint 和 AK/SK 一样走 GitHub Secrets：
  #   OSS_BUCKET / OSS_ENDPOINT / OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
  prefix: "linux"     # 产物 key 前缀，可参数化

architectures:
  amd64:
    arch_name: "x86_64"
    runner: "ubuntu-24.04"
    platform: "linux/amd64"
  arm64:
    arch_name: "aarch64"
    runner: "ubuntu-24.04-arm"
    platform: "linux/arm64"

targets:
  el7:
    # centos:7 是官方多架构镜像，amd64 与 arm64/v8 同 tag
    images: {amd64: "centos:7", arm64: "centos:7"}
    # 官方源已下线，构建时重写为 vault；如 GitHub runner 访问受限可换成镜像站，
    # 例如 https://archive.kernel.org/centos-vault
    vault_base: "https://vault.centos.org"
  el8:
    images: {amd64: "almalinux:8", arm64: "almalinux:8"}
  el9:
    images: {amd64: "almalinux:9", arm64: "almalinux:9"}
  el10:
    images: {amd64: "almalinux:10", arm64: "almalinux:10"}

# 上游二进制原件镜像。与 packages 语义不同：这里不编译、不分档位、不打我们的
# 命名约定，只把 Percona 发布的 tarball 原样搬到 OSS，供目标机快速取用。
# 设计见 docs/adr/0003-upstream-binary-mirror.md。
upstream:
  # Percona 的 glibc 档位编号不跟 RHEL 对齐：el8=2.28，el9=2.34，el10=2.39。
  # 2.35 只服务 Ubuntu 22.04，目标档位里没有对应发行版，故不请求。
  glibc_tiers: ["2.28", "2.34"]
  prefix: "linux"     # 与 packages 共用一层；文件名自带 Percona- 前缀，不会混

  components:
    percona-server:
      # 目录名与文件名都用完整版本串（含构建号），构建号无法从大版本推断，
      # 例如 PS 9.7.2-3 对应 XtraBackup 9.7.2-2，必须逐项写死。
      url: "https://downloads.percona.com/downloads/Percona-Server-{major_minor}/Percona-Server-{version}/binary/tarball/Percona-Server-{version}-Linux.x86_64.glibc{tier}-minimal.tar.gz"
      # el7(glibc 2.17) 没有 Percona 二进制 tarball，走官方 RPM
      versions: ["8.4.10-10", "9.7.2-3"]

    percona-xtrabackup:
      # 注意与 PS 的命名差异：architecture 段用连字符 Linux-x86_64，PS 用点 Linux.x86_64
      url: "https://downloads.percona.com/downloads/Percona-XtraBackup-{major_minor}/Percona-XtraBackup-{version}/binary/tarball/percona-xtrabackup-{version}-Linux-x86_64.glibc{tier}-minimal.tar.gz"
      versions: ["8.4.0-7", "9.7.2-2"]
      # xtrabackup 额外发布 glibc2.39 档（el10 用），PS 没有
      extra_glibc_tiers: ["2.39"]

    percona-toolkit:
      # toolkit 不分 glibc 档、不带 minimal 后缀，只有一个 _x86_64 包
      url: "https://downloads.percona.com/downloads/percona-toolkit/{version}/binary/tarball/percona-toolkit-{version}_x86_64.tar.gz"
      versions: ["3.7.0"]
      tiers: []     # 空列表 = 不展开档位

# 监控组件的上游发布件镜像。与 upstream 的区别：产物分架构（Go 静态二进制，
# 一套 Linux 文件覆盖 el7–el10）、用上游官方校验文件验证。
# 与 packages 的区别：不编译。见 docs/adr/0004-monitoring-upstream-mirror.md。
#
# 每个组件的 versions 只能有一个元素：产物名自带版本号，扫描共用前缀的目录
# 再按版本过滤，多版本会让「已存在即跳过」的判定失去意义。
monitoring:
  prefix: "linux"      # 与 packages / upstream 共用一层，靠文件名区分
  architectures: [amd64, arm64]

  # 产物就是上游发布件：保持原名与原压缩类型，不解压、不剥离、不改名。
  # assets 写上游资产名（按架构），落 OSS 的 key 与之相同。
  components:
    alertmanager:
      repo: "prometheus/alertmanager"
      # prometheus 的资产版本不带 v（tag 是 v0.35.0），这里也按这个格式写
      version: "0.35.0"
      # release tag 与版本号不同名，单独声明；缺省时回落到 version
      tag: "v0.35.0"
      assets:
        amd64: "alertmanager-{version}.linux-amd64.tar.gz"
        arm64: "alertmanager-{version}.linux-arm64.tar.gz"
      checksums:
        url: "https://github.com/prometheus/alertmanager/releases/download/v{version}/sha256sums.txt"

    alertmanager-webhook-adapter:
      # 原仓库 catatnight/alertmanager-webhook-adapter 已不存在，bougou 是现行维护分支
      repo: "bougou/alertmanager-webhook-adapter"
      version: "v1.1.14"
      # 上游资产没有扩展名，原样保留
      assets:
        amd64: "alertmanager-webhook-adapter-{version}-linux-amd64"
        arm64: "alertmanager-webhook-adapter-{version}-linux-arm64"
      checksums:
        url: "https://github.com/bougou/alertmanager-webhook-adapter/releases/download/{version}/SHA256SUMS"

    alloy:
      repo: "grafana/alloy"
      version: "v1.22.0"
      # 上游发的是 zip，原样保留
      assets:
        amd64: "alloy-linux-amd64.zip"
        arm64: "alloy-linux-arm64.zip"
      checksums:
        url: "https://github.com/grafana/alloy/releases/download/{version}/SHA256SUMS"

    grafana:
      # release 资产里没有 Linux tar.gz，走 grafana.com 的版本 API 取包清单
      catalog: "grafana"
      version: "13.3.1"
      assets:
        amd64: "grafana-{version}.linux-amd64.tar.gz"
        arm64: "grafana-{version}.linux-arm64.tar.gz"

    victoria-metrics:
      repo: "VictoriaMetrics/VictoriaMetrics"
      version: "v1.156.0"
      assets:
        amd64: "victoria-metrics-linux-amd64-{version}.tar.gz"
        arm64: "victoria-metrics-linux-arm64-{version}.tar.gz"

    victoria-logs:
      # VictoriaLogs 自 2025 年起独立发版，主版本号 1.x，与 VictoriaMetrics 不对齐
      repo: "VictoriaMetrics/VictoriaLogs"
      version: "v1.54.0"
      assets:
        amd64: "victoria-logs-linux-amd64-{version}.tar.gz"
        arm64: "victoria-logs-linux-arm64-{version}.tar.gz"

    vmutils:
      repo: "VictoriaMetrics/VictoriaMetrics"
      version: "v1.156.0"
      assets:
        amd64: "vmutils-linux-amd64-{version}.tar.gz"
        arm64: "vmutils-linux-arm64-{version}.tar.gz"

    vlutils:
      repo: "VictoriaMetrics/VictoriaLogs"
      version: "v1.54.0"
      assets:
        amd64: "vlutils-linux-amd64-{version}.tar.gz"
        arm64: "vlutils-linux-arm64-{version}.tar.gz"

    victoriametrics-metrics-datasource:
      # Grafana 数据源插件：前端 zip，只有一份，不按架构区分
      repo: "VictoriaMetrics/victoriametrics-datasource"
      version: "v1.0.1"
      single: true
      assets:
        default: "victoriametrics-metrics-datasource-{version}.zip"

    victoriametrics-logs-datasource:
      repo: "VictoriaMetrics/victorialogs-datasource"
      version: "v0.34.0"
      single: true
      assets:
        default: "victoriametrics-logs-datasource-{version}.zip"

# 中间件/基础服务的上游发布件镜像。结构与 monitoring 完全相同（同一套驱动，
# 用 --section middleware 区分），区别只在语义：这里放对象存储、消息队列、
# 注册配置中心等服务端原件。不编译、不分档位，产物保持上游原名原样搬运。
# 设计见 docs/adr/0005-middleware-upstream-mirror.md。
#
# 与 monitoring 一样：每个组件 versions 只能有一个元素，文件名自带版本号，
# 「已存在即跳过」靠共用前缀目录 + 文件名判定。
middleware:
  prefix: "linux"      # 与 packages / upstream / monitoring 共用一层，靠文件名区分
  architectures: [amd64, arm64]

  components:
    silo:
      # SILO：Pigsty 维护的 MinIO 发行线（pgsty/silo）。release tag 是 RELEASE.<ISO>，
      # 资产名用紧凑包版本 20261112000000.0.0，两个版本串必须分别声明
      repo: "pgsty/silo"
      version: "20261112000000.0.0"
      tag: "RELEASE.2026-11-12T00-00-00Z"
      assets:
        amd64: "silo_{version}_linux_amd64.tar.gz"
        arm64: "silo_{version}_linux_arm64.tar.gz"
      checksums:
        url: "https://github.com/pgsty/silo/releases/download/{tag}/silo_{version}_checksums.txt"

    mcli:
      # SILO 配套 S3 客户端（pgsty/mc），版本节奏与 silo 对齐；装到目标机后二进制名 mcli
      repo: "pgsty/mc"
      version: "20261112000000.0.0"
      tag: "RELEASE.2026-11-12T00-00-00Z"
      assets:
        amd64: "mcli_{version}_linux_amd64.tar.gz"
        arm64: "mcli_{version}_linux_arm64.tar.gz"
      checksums:
        url: "https://github.com/pgsty/mc/releases/download/{tag}/mcli_{version}_checksums.txt"

    rustfs:
      # RustFS 服务端。tag 与版本同名且不带 v；上游资产按 x86_64/aarch64 命名，
      # 与本段其他组件的 amd64/arm64 不同，靠显式 assets 模板消化。
      # 选 gnu（glibc）变体，与目标 EL 系统一致；上游同时发 musl 变体，不镜像。
      # 资产是 zip：与 alloy 一样保持原压缩类型，不解压不转格式。
      repo: "rustfs/rustfs"
      version: "1.0.6"
      assets:
        amd64: "rustfs-linux-x86_64-gnu-v{version}.zip"
        arm64: "rustfs-linux-aarch64-gnu-v{version}.zip"
      checksums:
        url: "https://github.com/rustfs/rustfs/releases/download/{version}/SHA256SUMS"

    rustfs-cli:
      # RustFS 官方 CLI（仓库名是 cli，产品名 rustfs-cli）。tag 带 v 而资产名也带 v，
      # version 保持无 v，tag 单独声明。同样选 gnu 变体；无 gnu 后缀的是 musl 包。
      repo: "rustfs/cli"
      version: "0.1.37"
      tag: "v0.1.37"
      assets:
        amd64: "rustfs-cli-linux-amd64-gnu-v{version}.tar.gz"
        arm64: "rustfs-cli-linux-arm64-gnu-v{version}.tar.gz"
      checksums:
        url: "https://github.com/rustfs/cli/releases/download/{tag}/SHA256SUMS"

    rabbitmq-server:
      # BEAM 虚拟机字节码，generic-unix 包不分架构，single。运行依赖目标机 Erlang
      # （本仓库 packages.erlang 自编译提供）。GitHub release 只有 GPG .asc 签名，
      # 没有哈希校验文件：走「告警 + 自算 sha256」路径，与 grafana 同等待遇。
      repo: "rabbitmq/rabbitmq-server"
      version: "4.4.1"
      tag: "v4.4.1"
      single: true
      assets:
        default: "rabbitmq-server-generic-unix-{version}.tar.xz"

    nacos-server:
      # Java 产物，不分架构，single。上游只发 BSD 格式的 .md5
      # （MD5 (file) = <hash>），没有 sha256；驱动按 algorithm: md5 走 md5sum 强校验，
      # 我们自己的 .sha256 侧车仍照常生成上传。
      repo: "alibaba/nacos"
      version: "3.3.0"
      single: true
      assets:
        default: "nacos-server-{version}.tar.gz"
      checksums:
        url: "https://github.com/alibaba/nacos/releases/download/{version}/nacos-server-{version}.tar.gz.md5"
        algorithm: "md5"

    mysql:
      # MySQL 不走 GitHub：目录页（os=2 = Linux Generic）的 HTML 表格内嵌每个资产的
      # MD5，没有独立校验文件；resolver 抓页面解析，下载走 cdn.mysql.com 稳定直链。
      # 产物统一为 minimal 命名（消费端 mysql_inplace_upgrade.sh 按 mysql-*-minimal.tar.* 匹配）。
      # x86_64 的 8.4/9.7 直接用上游官方 minimal；其余（8.0 双架构、8.4/9.7 的 arm64）
      # 上游只有 full 包，下载后用 transforms/make_mysql_minimal.sh 自制：
      # 删 bin/mysqld-debug、清空 lib/plugin/debug/*.so（保留空目录），并 --strip-unneeded。
      # 注意 8.0.46 故意选 glibc2.28 而非 2.17：与其余版本同档，el7 不在覆盖范围内。
      catalog: "mysql"
      page_url: "https://dev.mysql.com/downloads/mysql/{major_minor}.html?os=2"
      cdn_url: "https://cdn.mysql.com//Downloads/MySQL-{major_minor}/{source}"
      files:
        - version: "8.0.46"
          arch: "amd64"
          source: "mysql-8.0.46-linux-glibc2.28-x86_64.tar.xz"
          filename: "mysql-8.0.46-linux-glibc2.28-x86_64-minimal.tar.xz"
          transform: "mysql-minimal"
          strip: true
        - version: "8.0.46"
          arch: "arm64"
          source: "mysql-8.0.46-linux-glibc2.28-aarch64.tar.xz"
          filename: "mysql-8.0.46-linux-glibc2.28-aarch64-minimal.tar.xz"
          transform: "mysql-minimal"
          strip: true
        - version: "8.4.13"
          arch: "amd64"
          # 上游官方 minimal，原样搬运，只做页面 MD5 校验
          source: "mysql-8.4.13-linux-glibc2.28-x86_64-minimal.tar.xz"
        - version: "8.4.13"
          arch: "arm64"
          source: "mysql-8.4.13-linux-glibc2.28-aarch64.tar.xz"
          filename: "mysql-8.4.13-linux-glibc2.28-aarch64-minimal.tar.xz"
          transform: "mysql-minimal"
          strip: true
        - version: "9.7.4"
          arch: "amd64"
          source: "mysql-9.7.4-linux-glibc2.28-x86_64-minimal.tar.xz"
        - version: "9.7.4"
          arch: "arm64"
          source: "mysql-9.7.4-linux-glibc2.28-aarch64.tar.xz"
          filename: "mysql-9.7.4-linux-glibc2.28-aarch64-minimal.tar.xz"
          transform: "mysql-minimal"
          strip: true

# 静态植入组件。档位未列出的键回落到 default。
vendor:
  openssl:
    versions: {default: "3.5.9", el8: "3.0.22", el7: "1.1.1w"}
    # 旧分支的源码包被移到 source/old/ 下，需按档位覆盖 URL
    url: "https://www.openssl.org/source/openssl-{version}.tar.gz"
    urls:
      el8: "https://www.openssl.org/source/old/3.0/openssl-{version}.tar.gz"
      el7: "https://www.openssl.org/source/old/1.1.1/openssl-{version}.tar.gz"
  pcre2:
    versions: {default: "10.49", el7: "10.42"}
    url: "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-{version}/pcre2-{version}.tar.gz"
  zlib:
    # el7 用经典 zlib（需 nginx 的胶水编译），其余档位用 zlib-ng（--zlib-compat）
    default:
      package: "zlib-ng"
      version: "2.3.3"
      url: "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/{version}.tar.gz"
      dir: "zlib-ng-{version}"
    el8:
      package: "zlib-ng"
      version: "2.2.5"
      url: "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/{version}.tar.gz"
      dir: "zlib-ng-{version}"
    el7:
      package: "zlib"
      version: "1.3.2"
      # zlib.net 对 CI 数据中心 IP 稳定返回拦截页（HTTP 200 + HTML），改用官方仓库 tag 快照；
      # GitHub 归档解压顶层为 zlib-{version}（tag 的 v 前缀会被剥离），dir 不用改
      url: "https://github.com/madler/zlib/archive/refs/tags/v{version}.tar.gz"
      dir: "zlib-{version}"
  libxcrypt:
    versions: {default: "4.5.2", el8: "4.4.38", el7: "4.4.18"}
    url: "https://github.com/besser82/libxcrypt/releases/download/v{version}/libxcrypt-{version}.tar.xz"
    urls:
      # 4.4.18 没有发布附件，只有 tag 快照；无 configure，构建脚本会 autoreconf
      el7: "https://github.com/besser82/libxcrypt/archive/refs/tags/v{version}.tar.gz"

packages:
  nginx:
    enabled: true
    version: "1.30.7"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/nginx"
    source_url: "https://nginx.org/download/nginx-{version}.tar.gz"
    source_dir: "nginx-{version}"
    # --with-http_v3_module 需要 OpenSSL 3.2+，因此只有现代档（openssl 3.5.9）启用；
    # el7/el8 的 openssl 1.1.1w / 3.0.22 不满足。
    configure_args:
      default: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module
      el9: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_v3_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module
      el10: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_v3_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module

  openresty:
    enabled: true
    version: "1.31.8.1"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/openresty"
    source_url: "https://openresty.org/download/openresty-{version}.tar.gz"
    source_dir: "openresty-{version}"
    # 与 nginx 相同的静态植入方案；--with-http_v3_module 需要 OpenSSL 3.2+，
    # 只对 el9/el10（openssl 3.5.9）启用
    configure_args:
      default: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module
      el9: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_v3_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module
      el10: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_v3_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module

  valkey:
    enabled: true
    version: "9.1.4"
    versions:
      el7: "7.2.16"       # valkey 9.x 需 C11/GCC 5+；el7 的 gcc 4.8.5 只能编 7.2
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/redis"   # 与现网 Redis 部署目录保持一致
    source_url: "https://github.com/valkey-io/valkey/archive/refs/tags/{version}.tar.gz"
    source_dir: "valkey-{version}"
    # el7 上自带的 jemalloc 编译失败（persist-settings Error），改用系统 libc malloc
    make_args:
      default: ""
      el7: "MALLOC=libc"

  redis:
    enabled: true
    version: "8.10.3"
    versions:
      el7: "7.2.17"       # redis 8.x 需 C11/GCC 5+；el7 的 gcc 4.8.5 只能编 7.2
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/redis"   # 与现网 Redis 部署目录保持一致
    source_url: "https://download.redis.io/releases/redis-{version}.tar.gz"
    source_dir: "redis-{version}"
    # el7 上自带 jemalloc 编译失败，改用系统 libc malloc
    make_args:
      default: ""
      el7: "MALLOC=libc"

  postgresql:
    enabled: true
    version: "17.12"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/postgresql"
    source_url: "https://ftp.postgresql.org/pub/source/v{version}/postgresql-{version}.tar.gz"
    source_dir: "postgresql-{version}"
    # 依赖系统动态库（openssl/readline/zlib/libicu/systemd），与 ansible-build
    # 现有 PostgreSQL 产物保持一致；目标机需具备对应 runtime 库
    configure_args: >-
      --with-openssl
      --with-zlib
      --with-readline
      --with-icu
      --with-systemd

  haproxy:
    enabled: true
    version: "3.4.7"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/haproxy"
    # el7 的 gcc 4.8.5 在 aarch64 上对 atomic_fetch_adddi 触发 ICE
    # （could not split insn in final_scan_insn），el7 只做 amd64
    arches_by_os:
      el7: [amd64]
    source_url: "https://www.haproxy.org/download/3.4/src/haproxy-{version}.tar.gz"
    source_dir: "haproxy-{version}"
    # 四库静态植入（openssl/pcre2/zlib/libxcrypt），做法与 nginx 一致。
    # QUIC：el7 的 OpenSSL 1.1.1w 不启用；el8+ 走 OpenSSL compat 层。
    # KTLS：TARGET=linux-glibc 默认开启，但 el7 的 3.10 内核头文件没有 linux/tls.h，
    # 显式给空值关掉（显式赋值即视为已定义，default_opts 不会覆盖）。
    make_args:
      default: "USE_QUIC=1 USE_QUIC_OPENSSL_COMPAT=1"
      el7: "USE_KTLS="

  orchestrator:
    enabled: true
    version: "3.2.6"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/orchestrator"
    source_url: "https://github.com/openark/orchestrator/archive/refs/tags/v{version}.tar.gz"
    source_dir: "orchestrator-{version}"
    # GitHub 自动生成的 tag 归档没有稳定的 sha256（重新打包会变），不钉校验值
    # Go SDK 按架构下载校验；源码包自带 vendor，构建不联网。
    # cgo（vendored go-sqlite3）需要目标机 gcc。
    go:
      version: "1.26.10"
      url: "https://go.dev/dl/go{version}.linux-{goarch}.tar.gz"
      sha256:
        amd64: "ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5"
        arm64: "3f4227ce7b206a513e794f1393adb473a07b46e94d18bd15d1c684bbb7319797"

  erlang:
    enabled: true
    version: "27.3.4.19"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/erlang"
    # erlang.org 的 /download/ 只保留各系列最新版；带补丁号的版本
    # 只在 GitHub release 资产里
    source_url: "https://github.com/erlang/otp/releases/download/OTP-{version}/otp_src_{version}.tar.gz"
    source_dir: "otp_src_{version}"
