# 构建配置 —— 单一事实来源。
#
# 修改本文件或对应 scripts/<pkg>.sh 会触发该软件的 workflow。
# 版本覆盖规则：先取更具体的键，再回落到 default；例如 valkey 在 el7 上用 versions.el7。
#
# 注意：oss.endpoint 必须是公网 endpoint。GitHub 托管的 runner 在境外，
# 内网 endpoint（*-internal.aliyuncs.com）不可达。

build:
  source_dir: "/data/src"    # 源码下载与解压目录（容器内）
  output_dir: "/data/files"     # 产物目录（容器内），workflow 挂载宿主机 out/ 到这里

oss:
  # bucket 与 endpoint 和 AK/SK 一样走 GitHub Secrets：
  #   OSS_BUCKET / OSS_ENDPOINT / OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
  prefix: "linux"     # 产物 key 前缀，可参数化

architectures:
  amd64:
    arch_name: "x86_64"
    runner: "ubuntu-24.04"
    platform: "linux/amd64"
  arm64:
    arch_name: "aarch64"
    runner: "ubuntu-24.04-arm"
    platform: "linux/arm64"

targets:
  el7:
    # centos:7 是官方多架构镜像，amd64 与 arm64/v8 同 tag
    images: {amd64: "centos:7", arm64: "centos:7"}
    # 官方源已下线，构建时重写为 vault；如 GitHub runner 访问受限可换成镜像站，
    # 例如 https://archive.kernel.org/centos-vault
    vault_base: "https://vault.centos.org"
  el8:
    images: {amd64: "almalinux:8", arm64: "almalinux:8"}
  el9:
    images: {amd64: "almalinux:9", arm64: "almalinux:9"}
  el10:
    images: {amd64: "almalinux:10", arm64: "almalinux:10"}

# 静态植入组件。档位未列出的键回落到 default。
vendor:
  openssl:
    versions: {default: "3.5.9", el8: "3.0.22", el7: "1.1.1w"}
    # 旧分支的源码包被移到 source/old/ 下，需按档位覆盖 URL
    url: "https://www.openssl.org/source/openssl-{version}.tar.gz"
    urls:
      el8: "https://www.openssl.org/source/old/3.0/openssl-{version}.tar.gz"
      el7: "https://www.openssl.org/source/old/1.1.1/openssl-{version}.tar.gz"
  pcre2:
    versions: {default: "10.49", el7: "10.42"}
    url: "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-{version}/pcre2-{version}.tar.gz"
  zlib:
    # el7 用经典 zlib（需 nginx 的胶水编译），其余档位用 zlib-ng（--zlib-compat）
    default:
      package: "zlib-ng"
      version: "2.3.3"
      url: "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/{version}.tar.gz"
      dir: "zlib-ng-{version}"
    el8:
      package: "zlib-ng"
      version: "2.2.5"
      url: "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/{version}.tar.gz"
      dir: "zlib-ng-{version}"
    el7:
      package: "zlib"
      version: "1.3.2"
      url: "https://zlib.net/fossils/zlib-{version}.tar.gz"
      dir: "zlib-{version}"
  libxcrypt:
    versions: {default: "4.5.2", el8: "4.4.38", el7: "4.4.18"}
    url: "https://github.com/besser82/libxcrypt/releases/download/v{version}/libxcrypt-{version}.tar.xz"
    urls:
      # 4.4.18 没有发布附件，只有 tag 快照；无 configure，构建脚本会 autoreconf
      el7: "https://github.com/besser82/libxcrypt/archive/refs/tags/v{version}.tar.gz"

packages:
  nginx:
    enabled: false
    version: "1.30.6"
    sha256: "3cf46f5ed7504d460125866b7bea99fb357f31d887e2e63b35503310e9b8b6c8"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/nginx"
    source_url: "https://nginx.org/download/nginx-{version}.tar.gz"
    source_dir: "nginx-{version}"
    # --with-http_v3_module 需要 OpenSSL 3.2+，因此只有现代档（openssl 3.5.9）启用；
    # el7/el8 的 openssl 1.1.1w / 3.0.22 不满足。
    configure_args:
      default: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module
      el9: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_v3_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module
      el10: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_v3_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module

  openresty:
    enabled: false
    version: "1.31.8.1"
    sha256: "b569c63b420f80a4ac8466f2deffe73ed93ab760026532e039c3658409a997f4"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/openresty"
    source_url: "https://openresty.org/download/openresty-{version}.tar.gz"
    source_dir: "openresty-{version}"
    # 与 nginx 相同的静态植入方案；--with-http_v3_module 需要 OpenSSL 3.2+，
    # 只对 el9/el10（openssl 3.5.9）启用
    configure_args:
      default: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module
      el9: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_v3_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module
      el10: >-
        --with-http_ssl_module
        --with-http_v2_module
        --with-http_v3_module
        --with-http_realip_module
        --with-http_stub_status_module
        --with-stream
        --with-stream_ssl_module
        --with-stream_realip_module

  valkey:
    enabled: false
    version: "9.1.3"
    versions:
      el7: "7.2.15"       # valkey 9.x 需 C11/GCC 5+；el7 的 gcc 4.8.5 只能编 7.2
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/redis"   # 与现网 Redis 部署目录保持一致
    source_url: "https://github.com/valkey-io/valkey/archive/refs/tags/{version}.tar.gz"
    source_dir: "valkey-{version}"
    # 按版本钉 sha256；GitHub 自动生成的源码归档理论上可能被重新打包，
    # 若某天校验失败，重新计算并更新对应版本的值即可
    sha256:
      "9.1.3": "184e34ed2d9b51879b682b5b15205e2b9d677c60280e3cb453be8f520d04e293"
      "7.2.15": "a7750933605a272f732ccc32846411283472cdfca95391d41accd0aa73383d2b"
    # el7 上自带的 jemalloc 编译失败（persist-settings Error），改用系统 libc malloc
    make_args:
      default: ""
      el7: "MALLOC=libc"

  redis:
    enabled: false
    version: "8.10.3"
    versions:
      el7: "7.2.17"       # redis 8.x 需 C11/GCC 5+；el7 的 gcc 4.8.5 只能编 7.2
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/redis"   # 与现网 Redis 部署目录保持一致
    source_url: "https://download.redis.io/releases/redis-{version}.tar.gz"
    source_dir: "redis-{version}"
    sha256:
      "8.10.3": "edde778f6bdee7581e42fc139ca9e07e2822212092f7501f99989656e3629d02"
      "7.2.17": "07c679c013fd82513299733bddf91999bbbc830351ec9ea985a533b09a595d76"
    # el7 上自带 jemalloc 编译失败，改用系统 libc malloc
    make_args:
      default: ""
      el7: "MALLOC=libc"

  postgresql:
    enabled: false
    version: "17.10"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/postgresql"
    source_url: "https://ftp.postgresql.org/pub/source/v{version}/postgresql-{version}.tar.gz"
    source_dir: "postgresql-{version}"
    sha256:
      "17.10": "e4b43025f32ea3d271be64365d284c8462cffd41d80db0c3df6fc62417a2d9dc"
    # 依赖系统动态库（openssl/readline/zlib/libicu/systemd），与 ansible-build
    # 现有 PostgreSQL 产物保持一致；目标机需具备对应 runtime 库
    configure_args: >-
      --with-openssl
      --with-zlib
      --with-readline
      --with-icu
      --with-systemd

  haproxy:
    enabled: true
    version: "3.4.7"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/haproxy"
    # el7 的 gcc 4.8.5 在 aarch64 上对 atomic_fetch_adddi 触发 ICE
    # （could not split insn in final_scan_insn），el7 只做 amd64
    arches_by_os:
      el7: [amd64]
    source_url: "https://www.haproxy.org/download/3.4/src/haproxy-{version}.tar.gz"
    source_dir: "haproxy-{version}"
    sha256:
      "3.4.7": "ccfd342f3724c2cd659574044d788f44e20b212467c6bd5edbbfc517a2775dca"
    # 四库静态植入（openssl/pcre2/zlib/libxcrypt），做法与 nginx 一致。
    # QUIC：el7 的 OpenSSL 1.1.1w 不启用；el8+ 走 OpenSSL compat 层。
    # KTLS：TARGET=linux-glibc 默认开启，但 el7 的 3.10 内核头文件没有 linux/tls.h，
    # 显式给空值关掉（显式赋值即视为已定义，default_opts 不会覆盖）。
    make_args:
      default: "USE_QUIC=1 USE_QUIC_OPENSSL_COMPAT=1"
      el7: "USE_KTLS="

  erlang:
    enabled: false
    version: "27.3.4.19"
    os: [el7, el8, el9, el10]
    arches: [amd64, arm64]
    install_prefix: "/data/erlang"
    # erlang.org 的 /download/ 只保留各系列最新版；带补丁号的版本
    # 只在 GitHub release 资产里
    source_url: "https://github.com/erlang/otp/releases/download/OTP-{version}/otp_src_{version}.tar.gz"
    source_dir: "otp_src_{version}"
    sha256:
      "27.3.4.19": "866307e64e245e86bee15b3807030a998e59873d7480d6fae1e40b432a3d12b7"
