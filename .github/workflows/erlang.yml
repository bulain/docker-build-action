name: build erlang

on:
  push:
    branches: [master, main]
    paths:
      - "config.yaml"
      - "scripts/erlang.sh"
      - "scripts/common.sh"
      - ".github/workflows/erlang.yml"
      - ".github/workflows/_build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "OTP 版本（留空构建 config.yaml 的 version_matrix，如 26.2.5.21 / 27.3.4.19）"
        required: false
        default: ""
      force:
        description: "覆盖 OSS 上已存在的产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      package: erlang
      version: ${{ inputs.version || '' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit
