name: build-package

# 可复用工作流：生成矩阵 -> 容器内编译 -> 宿主机上传 OSS。
# 由 nginx.yml / valkey.yml 调用。

on:
  workflow_call:
    inputs:
      package:
        description: "config.yaml packages 下的键名"
        required: true
        type: string
      version:
        description: "覆盖 config.yaml 中的版本，留空使用配置值"
        required: false
        type: string
        default: ""
      force:
        description: "覆盖 OSS 上已存在的同名产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: 准备 PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyyaml>=6,<7"

      - name: 生成构建矩阵
        id: gen
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out=$("$RUNNER_TEMP/venv/bin/python" scripts/gen_matrix.py "$PACKAGE" \
            ${VERSION:+--version "$VERSION"})
          echo "matrix=$(printf '%s' "$out" | jq -c '.matrix')" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$out" | jq -r '.count')" >> "$GITHUB_OUTPUT"
          echo "$out" | jq -r '.matrix.include[] | "\(.os)/\(.arch) \(.image) v\(.version)"'

  build:
    needs: matrix
    if: needs.matrix.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 生成构建环境文件
        env:
          M: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          mkdir -p out
          jq -r 'to_entries[] | "\(.key | ascii_upcase)=\(.value)"' <<<"$M" \
            > "$RUNNER_TEMP/build.env"

      - name: 容器内编译
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/workspace" \
            -v "$PWD/out:/data/files" \
            -w /workspace \
            --env-file "$RUNNER_TEMP/build.env" \
            "${{ matrix.image }}" \
            bash "/workspace/scripts/${{ inputs.package }}.sh"

      - name: 安装 ossutil
        run: |
          set -euo pipefail
          arch=$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo amd64)
          version=2.4.0
          mkdir -p "$RUNNER_TEMP/ossutil"
          curl -fsSL -o "$RUNNER_TEMP/ossutil.zip" \
            "https://gosspublic.alicdn.com/ossutil/v2/${version}/ossutil-${version}-linux-${arch}.zip"
          unzip -q -o "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          ossutil=$(find "$RUNNER_TEMP/ossutil" -type f -name ossutil | head -n1)
          chmod +x "$ossutil"
          echo "OSSUTIL=$ossutil" >> "$GITHUB_ENV"

      - name: 上传到阿里云 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          FORCE: ${{ inputs.force }}
          OSS_PREFIX: ${{ matrix.oss_prefix }}
        run: |
          set -euo pipefail
          : "${OSS_ACCESS_KEY_ID:?缺少 secret OSS_ACCESS_KEY_ID}"
          : "${OSS_ACCESS_KEY_SECRET:?缺少 secret OSS_ACCESS_KEY_SECRET}"
          : "${OSS_BUCKET:?缺少 secret OSS_BUCKET}"
          : "${OSS_ENDPOINT:?缺少 secret OSS_ENDPOINT}"

          . out/manifest.env
          key="oss://${OSS_BUCKET}/${OSS_PREFIX}/${ARTIFACT_FILE}"
          auth=(-e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET")

          if "$OSSUTIL" stat "$key" "${auth[@]}" >/dev/null 2>&1 \
             && [ "${FORCE:-false}" != "true" ]; then
            echo "OSS 已存在，跳过: $key"
            echo "### 跳过（已存在）: $ARTIFACT_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          "$OSSUTIL" cp -f "out/${ARTIFACT_FILE}" "$key" "${auth[@]}"
          "$OSSUTIL" cp -f "out/${ARTIFACT_FILE}.sha256" "${key}.sha256" "${auth[@]}"
          "$OSSUTIL" stat "$key" "${auth[@]}" >/dev/null
          echo "已上传: $key (sha256 ${ARTIFACT_SHA256})"
          {
            echo "### ${ARTIFACT_FILE}"
            echo ""
            echo "- 路径: \`$key\`"
            echo "- sha256: \`${ARTIFACT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时保留产物供排查
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-${{ matrix.os }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7
