name: mirror jdk (all)

# 一键手动镜像全部 JDK 组件；各单组件入口同样仅支持手动触发。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "覆盖 OSS 上已存在的产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mirror:
    uses: ./.github/workflows/_jdk.yml
    with:
      components: ""
      force: ${{ inputs.force || false }}
    secrets: inherit
