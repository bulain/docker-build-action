name: mirror rustfs

# 镜像 RustFS 服务端（rustfs/rustfs）上游 gnu zip。不编译，见 docs/adr/0005。
# 仅 workflow_dispatch 手动触发；本入口只筛出自己那部分组件清单。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "覆盖 OSS 上已存在的产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mirror:
    uses: ./.github/workflows/_middleware.yml
    with:
      components: "rustfs"
      force: ${{ inputs.force || false }}
    secrets: inherit
