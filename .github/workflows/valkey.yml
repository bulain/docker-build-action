name: build valkey

on:
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "scripts/valkey.sh"
      - "scripts/common.sh"
      - ".github/workflows/valkey.yml"
      - ".github/workflows/_build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "valkey 版本（留空使用 config.yaml；el7 需 7.x）"
        required: false
        default: ""
      force:
        description: "覆盖 OSS 上已存在的产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      package: valkey
      version: ${{ inputs.version || '' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets: inherit
