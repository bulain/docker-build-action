name: mirror victoria-logs

# 镜像 VictoriaLogs 上游 tarball。不编译，见 docs/adr/0004。
# 改 config.yaml 会触发全部组件；本入口只筛出自己的那部分，避免每次改配置都跑十份。

on:
  push:
    branches: [master, main]
    paths:
      - "config.yaml"
      - "scripts/victoria-logs.sh"
      - "scripts/monitoring.sh"
      - "scripts/monitoring_resolve.py"
      - ".github/workflows/victoria-logs.yml"
      - ".github/workflows/_monitoring.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "覆盖 OSS 上已存在的产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mirror:
    uses: ./.github/workflows/_monitoring.yml
    with:
      components: "victoria-logs"
      force: ${{ inputs.force || false }}
    secrets: inherit
