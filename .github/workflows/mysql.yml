name: mirror mysql

# 镜像 MySQL generic tarball（官网 MD5 校验；arm64 与 8.0 自制 minimal + strip）。
# 不编译，见 docs/adr/0005。仅 workflow_dispatch 手动触发。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "覆盖 OSS 上已存在的产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mirror:
    uses: ./.github/workflows/_middleware.yml
    with:
      components: "mysql"
      force: ${{ inputs.force || false }}
    secrets: inherit
