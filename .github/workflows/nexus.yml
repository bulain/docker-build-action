name: mirror nexus

# 镜像 Sonatype Nexus Repository Manager unix tarball（download.sonatype.com 直链）。
# 不编译，见 docs/adr/0005。仅 workflow_dispatch 手动触发；本入口只筛出 nexus 组件。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "覆盖 OSS 上已存在的产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mirror:
    uses: ./.github/workflows/_middleware.yml
    with:
      components: "nexus"
      force: ${{ inputs.force || false }}
    secrets: inherit
