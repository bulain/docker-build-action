name: sync percona upstream (all)

# 一键手动镜像全部 Percona 组件；单组件入口见 percona-server / percona-xtrabackup /
# percona-toolkit 三个 workflow。设计见 docs/adr/0003。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "覆盖 OSS 上已存在的文件"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    uses: ./.github/workflows/_upstream-percona.yml
    with:
      force: ${{ inputs.force || false }}
    secrets: inherit
