name: mirror rocketmq

# 镜像 Apache RocketMQ 二进制 zip（archive.apache.org 直链，裸 sha512 边车）。不编译，见 docs/adr/0005。
# 仅 workflow_dispatch 手动触发；本入口只跑自己那部分组件清单。

on:
  workflow_dispatch:
    inputs:
      force:
        description: "覆盖 OSS 上已存在的产物"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mirror:
    uses: ./.github/workflows/_middleware.yml
    with:
      components: "rocketmq"
      force: ${{ inputs.force || false }}
    secrets: inherit
